<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña | Vectaria</title>
  <link rel="icon" type="image/png" href="img/vectaria-favicon-official.png?v=3">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/password-security.css">
  <link rel="stylesheet" href="css/brand-overtrack.css">
  <link rel="stylesheet" href="css/desktop-density.css?v=20261004-7">
</head>
<body class="login-overtrack">
  <div class="login-bg-grid"></div>

  <main class="login-wrapper">
    <section class="login-brand">
      <div class="brand-identity" aria-label="Vectaria, gestión operativa">
        <div class="login-brand-composite" role="img" aria-label="Vectaria - Tu operación, en una misma dirección">
          <img class="login-brand-layer login-brand-base" src="img/vectaria-logo-official.png?v=3" alt="">
        </div>
      </div>
      <p>Protege tu cuenta creando una contraseña personal.</p>
    </section>

    <section class="login-panel password-panel">
      <h2>Cambia tu contraseña</h2>
      <p class="login-subtitle">
        La contraseña temporal solo puede utilizarse para el primer acceso.
      </p>

      <label for="nuevaPassword">Nueva contraseña</label>
      <input id="nuevaPassword" type="password" autocomplete="new-password" aria-describedby="passwordRequirements">

      <label for="confirmarPassword">Confirmar contraseña</label>
      <input id="confirmarPassword" type="password" autocomplete="new-password" aria-describedby="passwordRequirements">

      <ul class="password-requirements" id="passwordRequirements">
        <li>Mínimo 12 caracteres.</li>
        <li>Mayúscula, minúscula, número y carácter especial.</li>
        <li>No reutilices la contraseña temporal.</li>
      </ul>

      <button id="btnCambiarPassword" class="btn-login" type="button">
        Guardar nueva contraseña
      </button>

      <p id="passwordError" class="login-error" aria-live="polite"></p>
      <p id="passwordMensaje" class="login-message" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="js/cambiar-password.js"></script>
</body>
</html>
