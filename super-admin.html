<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectaria | Super Administrador</title>
  <link rel="icon" type="image/png" href="img/vectaria-favicon-official.png?v=3">
  <link rel="stylesheet" href="css/super-admin.css">
  <link rel="stylesheet" href="css/super-admin-functional.css">
  <link rel="stylesheet" href="css/super-admin-brand.css">
  <link rel="stylesheet" href="css/notificaciones.css">
  <link rel="stylesheet" href="css/desktop-density.css?v=20261004-8">
</head>
<body class="super-admin-page">
  <div class="admin-layout">
    <header class="mobile-topbar">
      <div class="mobile-topbar-brand" aria-label="Vectaria">
        <div class="mobile-brand-composite" role="img" aria-label="Vectaria - Gestión operativa">
          <img class="mobile-brand-layer mobile-brand-base" src="img/vectaria-logo-official.png?v=3" alt="">
        </div>
      </div>
      <button type="button" class="mobile-menu-toggle" aria-controls="superAdminSidebar" aria-expanded="false" aria-label="Abrir menú de navegación">
        <span aria-hidden="true">☰</span>
        <span>Menú</span>
      </button>
    </header>
    <button type="button" class="mobile-menu-backdrop" aria-label="Cerrar menú de navegación" tabindex="-1"></button>

    <aside class="sidebar" id="superAdminSidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-composite" role="img" aria-label="Vectaria - Gestión operativa">
          <img class="sidebar-brand-layer sidebar-brand-base" src="img/vectaria-logo-official.png?v=3" alt="">
        </div>
      </div>
      <p>Super Admin</p>

      <nav aria-label="Administración global">
        <ul>
          <li><button type="button" class="active" data-super-view="dashboard" onclick="cambiarVistaSuperAdmin('dashboard', this)">Dashboard</button></li>
          <li><button type="button" data-super-view="empresas" onclick="cambiarVistaSuperAdmin('empresas', this)">Empresas</button></li>
          <li><button type="button" data-super-view="usuarios" onclick="cambiarVistaSuperAdmin('usuarios', this)">Usuarios</button></li>
          <li><button type="button" data-super-view="sucursales" onclick="cambiarVistaSuperAdmin('sucursales', this)">Sucursales</button></li>
          <li><button type="button" data-super-view="planes" onclick="cambiarVistaSuperAdmin('planes', this)">Planes</button></li>
          <li><button type="button" data-super-view="configuracion" onclick="cambiarVistaSuperAdmin('configuracion', this)">Configuración</button></li>
        </ul>
      </nav>

      <button type="button" onclick="logout()" class="btn-danger sidebar-logout">Cerrar sesión</button>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <div>
          <h1 id="tituloVista">Panel Super Administrador</h1>
          <p id="descripcionVista">Gestión global de empresas, usuarios y sucursales.</p>
        </div>
      </header>
      <div id="contenidoVista" aria-live="polite"></div>
    </main>
  </div>

  <script src="js/components/notificaciones.js"></script>
  <script type="module" src="./js/super-admin.js"></script>
</body>
</html>
