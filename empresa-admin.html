<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador de Empresa | OVERTRACK</title>

<link rel="stylesheet" href="css/empresa-admin.css">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <h2>OVERTRACK</h2>

        <p id="nombreEmpresa">Empresa</p>

        <ul>
            <li
  data-modulo="dashboard"
  onclick="cambiarVistaEmpresa('dashboard', this)"
>
  Dashboard
</li>

<li
  data-modulo="usuarios"
  onclick="cambiarVistaEmpresa('usuarios', this)"
>
  Usuarios
</li>

<li
  data-modulo="sucursales"
  onclick="cambiarVistaEmpresa('sucursales', this)"
>
  Sucursales
</li>

<li
  data-modulo="clientes"
  onclick="cambiarVistaEmpresa('clientes', this)"
>
  Clientes
</li>

<li
  data-modulo="equipos"
  onclick="cambiarVistaEmpresa('equipos', this)"
>
  Equipos
</li>

<li
  id="menuSistemaOperacional"
  data-modulo="ordenesServicio"
  onclick="irSistemaOperacional()"
>
  Operación del Taller
</li>

<li onclick="cambiarVistaEmpresa('configuracion', this)">
  Configuración
</li>

<li
  id="menuModulosEmpresa"
  onclick="cambiarVistaEmpresa('modulos', this)"
  style="display: none;"
>
  Módulos
</li>
        </ul>

        <button
            id="btnSalidaEmpresa"
            class="btn-danger">
        </button>

    </aside>

    <main class="main-content">

        <section class="dashboard-header">

            <h1 id="tituloEmpresa">
                Administrador de Empresa
            </h1>

            <p>
                Gestión completa de la empresa seleccionada.
            </p>

        </section>

        <section
            id="kpiEmpresaGrid"
            class="kpi-grid">
        </section>

        <section class="card">
            <div id="vistaEmpresaContenido">
                Cargando...
            </div>
        </section>


        <section id="vistaUsuarios" class="card" style="display:none; margin-top:24px;">

        <div class="section-header">
            <h2>Usuarios de la Empresa</h2>

            <button class="btn-primary" onclick="abrirModalUsuario()">
            + Nuevo Usuario
            </button>
        </div>

        <div id="listaUsuariosEmpresa">
            No hay usuarios registrados.
        </div>

        </section>

    </main>

</div>




<script type="module" src="js/empresa-admin.js"></script>

</body>

</html>
